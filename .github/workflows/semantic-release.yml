name: "Semantic Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      strict-mode:
        description: 'Validar Conventional Commits rigorosamente'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: heliomarpm/reusable-workflows/.github/workflows/cd-semantic-release.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      project-path: '.'
      strict-conventional-commits: ${{ inputs.strict-mode != false }}
      skip-version-file: true
